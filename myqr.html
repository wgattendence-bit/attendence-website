<!DOCTYPE html>
<html>
<head>
  <title>My QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  < style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }
    input {
      padding: 10px;
      width: 250px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Get Your Attendance QR</h2>

<input id="name" placeholder="Enter your name" />
<br>
<button onclick="generateQR()">Show My QR</button>

<div id="qrcode" style="margin-top:20px;"></div>

<br><br>
<button onclick="goScan()">Scan QR for Attendance</button>

<script>
function generateQR() {
  document.getElementById("qrcode").innerHTML = "";
  let name = document.getElementById("name").value;
  if (!name) {
    alert("Please enter your name");
    return;
  }
  new QRCode(document.getElementById("qrcode"), name);
}

function goScan() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
